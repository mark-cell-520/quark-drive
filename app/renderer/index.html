<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Defence in depth (audit finding E-1): the renderer needs nothing but
       its own script/style files and data: QR images. Blocking everything
       else means even a hypothetical renderer compromise cannot load or
       exfiltrate to remote origins. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>QuarkDrive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="logo">Q</span>
      <span>QuarkDrive</span>
    </div>
    <span class="subtitle">夸克网盘 · 本地硬盘</span>
  </header>

  <!-- ── login view ───────────────────────────────────────────── -->
  <section id="view-login" class="view hidden">
    <div class="card">
      <h2>扫码登录</h2>
      <p class="hint">请使用夸克 APP 扫描下方二维码登录</p>
      <div id="qr-box" class="qr-box">
        <img id="qr-img" alt="登录二维码" class="hidden">
        <div id="qr-placeholder" class="qr-placeholder">二维码加载中…</div>
      </div>
      <p id="login-status" class="status">等待初始化…</p>
      <p id="qr-expiry" class="hint hidden"></p>      <div class="row">
        <button id="btn-refresh-qr" class="btn secondary" type="button">刷新二维码</button>
        <button id="btn-cancel-login" class="btn secondary" type="button">取消</button>
      </div>
    </div>
  </section>

  <!-- ── main view ────────────────────────────────────────────── -->
  <section id="view-main" class="view hidden">
    <div class="card">
      <div class="account">
        <div>
          <div id="account-name" class="account-name">—</div>
          <div id="account-type" class="account-type">—</div>
        </div>
        <button id="btn-logout" class="btn secondary small" type="button">退出登录</button>
      </div>
      <div class="capacity">
        <div class="capacity-labels">
          <span id="cap-used">—</span>
          <span id="cap-total">—</span>
        </div>
        <div class="capacity-bar"><div id="cap-fill" class="capacity-fill"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>硬盘挂载</h2>
      <div id="mount-state" class="mount-state">未挂载</div>
      <div id="transfer-line" class="transfer-line hidden"></div>
      <div class="row">
        <label for="sel-letter">盘符</label>
        <select id="sel-letter"></select>
        <button id="btn-mount" class="btn primary" type="button">挂载</button>
        <button id="btn-unmount" class="btn danger hidden" type="button">卸载</button>
        <button id="btn-open-drive" class="btn secondary hidden" type="button">打开</button>
      </div>
      <p id="mount-hint" class="hint">挂载后可在文件资源管理器中像本地磁盘一样浏览夸克网盘。</p>
    </div>

    <div class="card">
      <h2>设置</h2>
      <label class="checkbox">
        <input type="checkbox" id="chk-automount">
        <span>启动时自动挂载</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="chk-autostart">
        <span>开机自动启动（最小化到托盘）</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="chk-startmin">
        <span>启动时最小化到托盘（不显示主窗口）</span>
      </label>

      <div class="cache-block">
        <div class="row">
          <label for="sel-cache-size">缓存大小</label>
          <select id="sel-cache-size">
            <option value="512M">512 MB</option>
            <option value="1G">1 GB</option>
            <option value="2G">2 GB</option>
            <option value="5G">5 GB</option>
            <option value="10G">10 GB（默认）</option>
            <option value="20G">20 GB</option>
            <option value="50G">50 GB</option>
            <option value="off">不限</option>
            <option value="__custom">自定义…</option>
          </select>
        </div>
        <div class="row hidden" id="cache-custom-row">
          <label for="inp-cache-size">自定义</label>
          <input id="inp-cache-size" type="text" placeholder="如 12G / 500M / off" spellcheck="false">
        </div>
        <div class="row">
          <label for="sel-cache-mode">缓存模式</label>
          <select id="sel-cache-mode">
            <option value="writes">写入缓存（推荐）</option>
            <option value="full">完整缓存（读取更流畅，更占空间）</option>
            <option value="minimal">最小缓存</option>
            <option value="off">关闭</option>
          </select>
        </div>
        <div class="row">
          <button id="btn-clear-cache" class="btn secondary small" type="button">清理缓存</button>
          <span id="cache-status" class="cache-status"></span>
        </div>
        <p class="hint">磁盘缓存让浏览与读取更流畅；修改大小/模式后重新挂载生效。缓存位于本机 %LOCALAPPDATA%\QuarkDrive\vfs-cache。</p>
      </div>

      <div class="row">
        <button id="btn-logs" class="btn secondary small" type="button">打开日志目录</button>
        <button id="btn-quit" class="btn danger small" type="button">退出应用</button>
        <span id="version" class="version"></span>
      </div>
      <p class="hint">关闭窗口只是最小化到托盘；退出会先安全卸载盘符。</p>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
